<svg xmlns="http://www.w3.org/2000/svg" width="760" height="42" viewBox="0 0 760 42" role="img" aria-labelledby="title">
  <title id="title">Web Developer | UI UX Designer | Data Analyst | Bookkeeper</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; }
    .role { animation: colorShift 8s linear infinite; }
    .role:nth-of-type(2) { animation-delay: -2s; }
    .role:nth-of-type(3) { animation-delay: -4s; }
    .role:nth-of-type(4) { animation-delay: -6s; }
    @keyframes colorShift {
      0%, 100% { fill: #00bcd4; }
      25% { fill: #4caf50; }
      50% { fill: #ff9800; }
      75% { fill: #e91e63; }
    }
  </style>
  <text x="380" y="27" text-anchor="middle">
    <tspan class="role">Web Developer</tspan>
    <tspan fill="#777"> | </tspan>
    <tspan class="role">UI UX Designer</tspan>
    <tspan fill="#777"> | </tspan>
    <tspan class="role">Data Analyst</tspan>
    <tspan fill="#777"> | </tspan>
    <tspan class="role">Bookkeeper</tspan>
  </text>
</svg>
