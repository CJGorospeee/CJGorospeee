<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48" role="img" aria-labelledby="title">
  <title id="title">Web Developer | UI UX Designer | Data Analyst | IT Support | Bookkeeper</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; }
  </style>
  <defs>
    <linearGradient id="roleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4">
        <animate attributeName="stop-color" values="#00bcd4;#7c4dff;#00bcd4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="45%" stop-color="#7c4dff">
        <animate attributeName="stop-color" values="#7c4dff;#e91e63;#7c4dff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff9800">
        <animate attributeName="stop-color" values="#ff9800;#00bcd4;#ff9800" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <text x="430" y="30" text-anchor="middle" fill="url(#roleGradient)">
    Web Developer | UI UX Designer | Data Analyst | IT Support | Bookkeeper
  </text>
</svg>
